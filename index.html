    1. Please verify all information before submitting.<br>
    2. Do not submit incorrect transaction information.
  </div>

  <div class="logos">
    <div class="p">PhonePe</div>
    <div class="t">paytm</div>
    <div class="u">UPI</div>
  </div>

  <div class="footer">
    Payment Portal<br>
    Secure payment information
  </div>

</div>

<script>
const params=new URLSearchParams(location.search);

if(params.get("amount"))
  document.getElementById("amount").textContent="₹ "+params.get("amount");

if(params.get("upi"))
  document.getElementById("upi").textContent=params.get("upi");

function copyText(id){
  navigator.clipboard.writeText(
    document.getElementById(id).textContent
  );
}

let time=596;

setInterval(()=>{
  if(time<=0)return;
  time--;
  document.getElementById("min").textContent=
    String(Math.floor(time/60)).padStart(2,"0");
  document.getElementById("sec").textContent=
    String(time%60).padStart(2,"0");
},1000);
</script>

</body>
</html>
