<button class="submit" onclick="submitUTR()">
    Submit UTR
  </button>

  <div class="notice-title">
    Notice:
  </div>

  <div class="notice">
    1. Please verify all payment details before submitting.<br>
    2. Do not submit incorrect transaction information.
  </div>

  <div class="footer">
    Payment Portal<br>
    Secure payment information
  </div>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const amount = params.get("amount");
const upi = params.get("upi");

if(amount){
  document.getElementById("amount").textContent =
    "₹ " + amount;
}

if(upi){
  document.getElementById("upi").textContent =
    upi;
}

function copyValue(id){

  const text =
    document.getElementById(id).textContent;

  navigator.clipboard.writeText(text);

  alert("Copied");
}

function submitUTR(){

  const utr =
    document.getElementById("utr").value.trim();

  if(!utr){
    alert("Please enter the UTR number.");
    return;
  }

  alert("Reference submitted.");
}

let totalSeconds = 596;

setInterval(function(){

  if(totalSeconds <= 0) return;

  totalSeconds--;

  const minutes =
    Math.floor(totalSeconds / 60);

  const seconds =
    totalSeconds % 60;

  document.getElementById("minutes").textContent =
    String(minutes).padStart(2,"0");

  document.getElementById("seconds").textContent =
    String(seconds).padStart(2,"0");

},1000);

</script>

</body>
</html>
