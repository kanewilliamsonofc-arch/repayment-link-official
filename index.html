<div class="ut-row">
    <div class="ut-label">UTR</div>

    <input
      class="ut-input"
      id="utr"
      type="text"
      placeholder="Input UTR number"
    >
  </div>

  <button class="submit" onclick="submitReference()">
    Submit UTR
  </button>

  <div class="notice-title">
    Notice:
  </div>

  <div class="notice">
    1. Please verify the payment details before continuing.<br>
    2. Do not submit incorrect transaction information.
  </div>

  <div class="footer">
    Payment Portal<br>
    Secure payment information
  </div>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const amount = params.get("amount");
const upi = params.get("upi");

if(amount){
  document.getElementById("amount").textContent = "₹ " + amount;
}

if(upi){
  document.getElementById("upi").textContent = upi;
}

function copyValue(id){

  const value =
    document.getElementById(id).textContent;

  navigator.clipboard.writeText(value);

  alert("Copied");
}

function submitReference(){

  const utr =
    document.getElementById("utr").value.trim();

  if(!utr){
    alert("Please enter the reference number.");
    return;
  }

  alert("Reference submitted.");
}

let seconds = 596;

setInterval(function(){

  if(seconds <= 0) return;

  seconds--;

  const m =
    Math.floor(seconds / 60);

  const s =
    seconds % 60;

  document.getElementById("min").textContent =
    String(m).padStart(2,"0");

  document.getElementById("sec").textContent =
    String(s).padStart(2,"0");

},1000);

</script>

</body>
</html>
